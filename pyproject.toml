[project]
name = "luopan-data-center"
version = "0.1.0"
description = "Douyin Compass and inventory data center"
requires-python = ">=3.11,<3.12"
dependencies = [
    "apscheduler",

    "openpyxl",
    "pandas",
    "playwright",
]

[tool.uv]
# This is an application repository, not a distributable Python package.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
