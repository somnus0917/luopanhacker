x-luopan-volumes: &luopan-volumes
  - ${LUOPAN_DATA_DIR:-.}/output:/app/output
  - ${LUOPAN_DATA_DIR:-.}/session:/app/session
  - ${LUOPAN_DATA_DIR:-.}/logs:/app/logs
  - ${LUOPAN_DATA_DIR:-.}/config:/app/config
  - ${LUOPAN_DATA_DIR:-.}/state:/app/state

services:
  compass-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-}
    image: ${LUOPAN_IMAGE:-luopan-compass-dashboard}
    container_name: douyin-compass
    ports:
      - "${LUOPAN_HOST_BIND:-127.0.0.1}:${LUOPAN_DASHBOARD_PORT:-8501}:8501"
    volumes: *luopan-volumes
    environment:
      - TZ=Asia/Shanghai
      - LUOPAN_SERVICE_ROLE=api
      - LUOPAN_STATE_DIR=/app/state
      - NOVNC_URL=${NOVNC_URL:-http://127.0.0.1:6080}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - LUOPAN_API_RS_HOST=${LUOPAN_API_RS_HOST:-0.0.0.0}
      - LUOPAN_API_RS_PORT=8501
      - LUOPAN_API_RS_STORAGE_READS=${LUOPAN_API_RS_STORAGE_READS:-true}
      - LUOPAN_ENV=production
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-true}
      - LUOPAN_TRUSTED_ORIGINS=${LUOPAN_TRUSTED_ORIGINS:-}
      - LUOPAN_STORAGE_DB=${LUOPAN_STORAGE_DB:-/app/state/luopan.db}
    depends_on:
      - compass-collector
    restart: unless-stopped

  compass-collector:
    image: ${LUOPAN_IMAGE:-luopan-compass-dashboard}
    container_name: douyin-compass-collector
    ports:
      - "${LUOPAN_HOST_BIND:-127.0.0.1}:${LUOPAN_NOVNC_PORT:-6080}:6080"
    volumes: *luopan-volumes
    environment:
      - TZ=Asia/Shanghai
      - LUOPAN_SERVICE_ROLE=collector
      - DISPLAY=:99
      - CHROMIUM_EXECUTABLE_PATH=/usr/bin/chromium
      - STATUS_UPDATE_COMMAND=${STATUS_UPDATE_COMMAND:-luopan-worker-rs status-update}
      - COLLECTION_WORKER_COMMAND=${COLLECTION_WORKER_COMMAND:-luopan-worker-rs compass-collect}
      - SCHEDULED_SCRAPE_RUST_WORKER=${SCHEDULED_SCRAPE_RUST_WORKER:-true}
      - STORAGE_SYNC_AFTER_SCRAPE=${STORAGE_SYNC_AFTER_SCRAPE:-true}
      - LUOPAN_STATE_DIR=/app/state
      - LUOPAN_STORAGE_DB=${LUOPAN_STORAGE_DB:-/app/state/luopan.db}
    restart: unless-stopped
