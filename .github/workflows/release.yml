name: Release image

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

concurrency:
  group: luopan-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  verify-main-head:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.verify.outputs.should_release }}
    steps:
      - id: verify
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          latest_sha="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | awk '{print $1}')"
          if [[ "$VALIDATED_SHA" == "$latest_sha" ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping stale CI result: validated=$VALIDATED_SHA current_main=$latest_sha"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: verify-main-head
    if: needs.verify-main-head.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/luopanhacker:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=luopan-production
          cache-to: type=gha,mode=max,scope=luopan-production
