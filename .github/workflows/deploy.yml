name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

concurrency:
  group: luopan-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-main-head:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.verify.outputs.should_deploy }}
    steps:
      - id: verify
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          latest_sha="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | awk '{print $1}')"
          if [[ "$VALIDATED_SHA" == "$latest_sha" ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping stale CI result: validated=$VALIDATED_SHA current_main=$latest_sha"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: verify-main-head
    if: needs.verify-main-head.outputs.should_deploy == 'true' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure restricted deployment key
        env:
          DEPLOY_KEY: ${{ secrets.LUOPAN_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.LUOPAN_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy committed main branch
        env:
          DEPLOY_HOST: ${{ secrets.LUOPAN_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.LUOPAN_DEPLOY_USER }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "${DEPLOY_USER}@${DEPLOY_HOST}" "deploy ${DEPLOY_SHA}"
