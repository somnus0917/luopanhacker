name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: luopan-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: Validate code and deployment configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out committed source
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/0.11.29/install.sh | \
            env UV_UNMANAGED_INSTALL="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Sync locked Python environment
        run: uv sync --locked --no-dev
      - name: Run Python syntax and unit checks
        run: |
          uv run --locked python -m compileall -q \
            dashboard.py db.py web_app.py external_order_store.py import_external_orders.py \
            inventory_data.py inventory_sync.py scheduler_run.py
          uv run --locked python -m unittest discover -s tests -v
      - name: Check browser JavaScript syntax
        uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Check JavaScript and shell scripts
        run: |
          node --check web/static/app.js
          bash -n ops/deploy.sh ops/backup.sh ops/ssh-deploy-wrapper.sh \
            docker/start.sh docker/cron_scrape.sh docker/cron_inventory_sync.sh
      - name: Validate Docker Compose production mounts
        run: |
          docker compose config >/dev/null
          LUOPAN_DATA_DIR=/srv/luopan-data docker compose config | \
            grep -q '/srv/luopan-data/state'

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Configure restricted deployment key
        env:
          DEPLOY_KEY: ${{ secrets.LUOPAN_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.LUOPAN_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy committed main branch
        env:
          DEPLOY_HOST: ${{ secrets.LUOPAN_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.LUOPAN_DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" deploy
