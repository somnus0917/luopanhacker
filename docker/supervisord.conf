[supervisord]
nodaemon=true
logfile=/app/logs/supervisord.log
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:xvfb]
command=Xvfb :99 -screen 0 1920x1080x24 -ac
autostart=true
autorestart=true
stdout_logfile=/app/logs/xvfb.log
stderr_logfile=/app/logs/xvfb.err

[program:x11vnc]
command=x11vnc -display :99 -forever -shared -rfbport 5900
autostart=true
autorestart=true
stdout_logfile=/app/logs/x11vnc.log
stderr_logfile=/app/logs/x11vnc.err

[program:novnc]
command=websockify --web /usr/share/novnc 6080 localhost:5900
autostart=true
autorestart=true
stdout_logfile=/app/logs/novnc.log
stderr_logfile=/app/logs/novnc.err

[program:dashboard]
command=gunicorn --workers 2 --bind 0.0.0.0:8501 web_app:app
directory=/app
autostart=true
autorestart=true
stdout_logfile=/app/logs/dashboard.log
stderr_logfile=/app/logs/dashboard.err

[program:rust-api-rs]
command=/app/docker/run_api_rs.sh
directory=/app
autostart=true
autorestart=true
stdout_logfile=/app/logs/rust-api-rs.log
stderr_logfile=/app/logs/rust-api-rs.err

[program:cron]
command=cron -f
autostart=true
autorestart=true
stdout_logfile=/app/logs/cron.log
stderr_logfile=/app/logs/cron.err
