[supervisord]
nodaemon=true
logfile=/app/logs/supervisord-collector.log
pidfile=/tmp/supervisord-collector.pid

[program:xvfb]
command=Xvfb :99 -screen 0 1920x1080x24 -ac
autostart=true
autorestart=true
stdout_logfile=/app/logs/xvfb.log
stderr_logfile=/app/logs/xvfb.err

[program:x11vnc]
command=x11vnc -display :99 -forever -shared -rfbport 5900
autostart=true
autorestart=true
stdout_logfile=/app/logs/x11vnc.log
stderr_logfile=/app/logs/x11vnc.err

[program:novnc]
command=websockify --web /usr/share/novnc 6080 localhost:5900
autostart=true
autorestart=true
stdout_logfile=/app/logs/novnc.log
stderr_logfile=/app/logs/novnc.err

[program:collector]
command=python3 apps/collector_py/service.py
directory=/app
autostart=true
autorestart=true
stdout_logfile=/app/logs/collector.log
stderr_logfile=/app/logs/collector.err
environment=PYTHONUNBUFFERED="1"

[program:cron]
command=cron -f
autostart=true
autorestart=true
stdout_logfile=/app/logs/cron.log
stderr_logfile=/app/logs/cron.err
